<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: Akita coast at dusk, offshore wind turbines + AI data center, gold capital light from the west -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="30%" stop-color="#16264c"/>
      <stop offset="58%" stop-color="#3d3a5e"/>
      <stop offset="78%" stop-color="#8a5c3a"/>
      <stop offset="100%" stop-color="#c98b4b"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="18%" cy="60%" r="42%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a1024" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dcglow" cx="72%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0a1024" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3f66"/>
      <stop offset="100%" stop-color="#101a34"/>
    </linearGradient>
    <radialGradient id="vgn" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.78)"/>
    </radialGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="35%" stop-color="rgba(0,0,0,0.58)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.94)"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,1)"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#sunglow)"/>
  <rect width="1200" height="630" fill="url(#dcglow)"/>

  <!-- Setting sun over the Sea of Japan -->
  <circle cx="216" cy="352" r="46" fill="#fcd34d" opacity="0.75" filter="url(#blur12)"/>
  <circle cx="216" cy="352" r="26" fill="#fde68a" opacity="0.9"/>

  <!-- Stars in the upper sky -->
  <g fill="white" opacity="0.75">
    <circle cx="120" cy="44" r="1.2"/><circle cx="300" cy="68" r="1"/><circle cx="470" cy="36" r="1.2"/>
    <circle cx="640" cy="60" r="1"/><circle cx="820" cy="40" r="1.2"/><circle cx="1000" cy="66" r="1"/>
    <circle cx="1130" cy="34" r="1.1"/><circle cx="390" cy="112" r="0.9"/><circle cx="900" cy="120" r="0.9"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="386" width="1200" height="120" fill="url(#sea)"/>
  <!-- sun reflection on water -->
  <g fill="#fbbf24" opacity="0.35">
    <rect x="196" y="396" width="42" height="4" rx="2"/><rect x="184" y="412" width="66" height="4" rx="2"/>
    <rect x="172" y="430" width="90" height="4" rx="2"/><rect x="188" y="450" width="58" height="3" rx="1.5"/>
    <rect x="200" y="470" width="36" height="3" rx="1.5"/>
  </g>
  <g stroke="#8fb0d8" stroke-width="1.4" opacity="0.18" fill="none">
    <path d="M 0 404 Q 300 396 600 406 Q 900 416 1200 400"/>
    <path d="M 0 442 Q 320 434 640 446 Q 940 456 1200 438"/>
  </g>

  <!-- Offshore wind turbines (Akita coast) - left/center -->
  <g stroke="#e8f2fa" stroke-width="4" opacity="0.92">
    <line x1="128" y1="404" x2="128" y2="236"/>
  </g>
  <circle cx="128" cy="232" r="7" fill="#e8f2fa"/>
  <g stroke="#e8f2fa" stroke-width="4" opacity="0.92">
    <line x1="128" y1="232" x2="86" y2="162"/>
    <line x1="128" y1="232" x2="181" y2="200"/>
    <line x1="128" y1="232" x2="110" y2="292"/>
  </g>
  <g stroke="#d6e6f5" stroke-width="3.2" opacity="0.8">
    <line x1="252" y1="410" x2="252" y2="268"/>
    <line x1="252" y1="268" x2="216" y2="214"/>
    <line x1="252" y1="268" x2="296" y2="242"/>
    <line x1="252" y1="268" x2="238" y2="318"/>
  </g>
  <circle cx="252" cy="266" r="5.5" fill="#d6e6f5" opacity="0.85"/>
  <g stroke="#bfd6ea" stroke-width="2.6" opacity="0.62">
    <line x1="356" y1="414" x2="356" y2="298"/>
    <line x1="356" y1="298" x2="328" y2="256"/>
    <line x1="356" y1="298" x2="392" y2="278"/>
    <line x1="356" y1="298" x2="344" y2="340"/>
  </g>
  <circle cx="356" cy="296" r="4" fill="#bfd6ea" opacity="0.7"/>
  <g stroke="#a8c6de" stroke-width="2" opacity="0.42">
    <line x1="444" y1="416" x2="444" y2="324"/>
    <line x1="444" y1="324" x2="422" y2="290"/>
    <line x1="444" y1="324" x2="472" y2="308"/>
  </g>

  <!-- Coastline / industrial park ground -->
  <path d="M 0 500 Q 300 490 620 498 Q 900 505 1200 494 L 1200 630 L 0 630 Z" fill="#0d1730"/>
  <path d="M 0 508 Q 320 500 640 508 Q 940 514 1200 503 L 1200 630 L 0 630 Z" fill="#0a1226" opacity="0.85"/>

  <!-- MAIN AI DATA CENTER (right, on the industrial park) -->
  <rect x="640" y="352" width="360" height="150" rx="4" fill="#0b1c38" stroke="#22d3ee" stroke-width="2.5"/>
  <!-- roof cooling units -->
  <g fill="#122a4d" stroke="#155e75" stroke-width="1">
    <rect x="656" y="330" width="50" height="23" rx="2"/><rect x="720" y="326" width="50" height="27" rx="2"/>
    <rect x="784" y="330" width="50" height="23" rx="2"/><rect x="848" y="326" width="50" height="27" rx="2"/>
    <rect x="912" y="330" width="50" height="23" rx="2"/>
  </g>
  <!-- server window rows -->
  <g fill="#22d3ee" opacity="0.9" filter="url(#glow)">
    <rect x="658" y="372" width="38" height="23" rx="2"/><rect x="706" y="372" width="38" height="23" rx="2"/>
    <rect x="754" y="372" width="38" height="23" rx="2"/><rect x="802" y="372" width="38" height="23" rx="2"/>
    <rect x="850" y="372" width="38" height="23" rx="2"/><rect x="898" y="372" width="38" height="23" rx="2"/>
    <rect x="658" y="408" width="38" height="23" rx="2"/><rect x="706" y="408" width="38" height="23" rx="2"/>
    <rect x="754" y="408" width="38" height="23" rx="2"/><rect x="802" y="408" width="38" height="23" rx="2"/>
    <rect x="850" y="408" width="38" height="23" rx="2"/>
    <rect x="658" y="444" width="38" height="23" rx="2"/><rect x="706" y="444" width="38" height="23" rx="2"/>
    <rect x="754" y="444" width="38" height="23" rx="2"/>
  </g>
  <!-- status LEDs -->
  <g fill="#34d399" filter="url(#glow)">
    <circle cx="972" cy="386" r="4"/><circle cx="972" cy="410" r="4"/>
  </g>
  <circle cx="972" cy="434" r="4" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Second building block, further right -->
  <rect x="1024" y="398" width="150" height="104" rx="4" fill="#0b1c38" stroke="#0e7490" stroke-width="2"/>
  <g fill="#22d3ee" opacity="0.62" filter="url(#glow)">
    <rect x="1038" y="416" width="30" height="18" rx="2"/><rect x="1076" y="416" width="30" height="18" rx="2"/>
    <rect x="1114" y="416" width="30" height="18" rx="2"/>
    <rect x="1038" y="446" width="30" height="18" rx="2"/><rect x="1076" y="446" width="30" height="18" rx="2"/>
  </g>

  <!-- Substation pylons linking wind farm to the DC -->
  <polygon points="524,486 516,346 532,346" fill="#080f22"/>
  <line x1="494" y1="360" x2="554" y2="360" stroke="#080f22" stroke-width="3.5"/>
  <line x1="500" y1="390" x2="548" y2="390" stroke="#080f22" stroke-width="3"/>
  <polygon points="600,492 593,366 607,366" fill="#080f22"/>
  <line x1="574" y1="380" x2="626" y2="380" stroke="#080f22" stroke-width="3"/>
  <!-- power lines: turbines -> pylons -> DC -->
  <g stroke="#080f22" stroke-width="2.4" fill="none" opacity="0.9">
    <path d="M 128 330 Q 300 340 494 360 Q 540 368 574 380 Q 610 386 640 390"/>
    <path d="M 134 358 Q 306 368 500 390 Q 545 396 578 404 Q 612 410 640 414"/>
  </g>

  <!-- Gold capital streams flowing from the left (Gulf money) -->
  <g filter="url(#blur12)" opacity="0.4">
    <path d="M -20 250 Q 260 236 520 280 Q 760 320 1120 300" fill="none" stroke="#fbbf24" stroke-width="12"/>
    <path d="M -20 300 Q 250 292 500 330 Q 780 372 1150 344" fill="none" stroke="#f59e0b" stroke-width="7" opacity="0.75"/>
  </g>
  <g fill="#fcd34d" opacity="0.85" filter="url(#glow)">
    <circle cx="330" cy="252" r="4"/><circle cx="470" cy="272" r="3.2"/><circle cx="612" cy="298" r="4.2"/>
    <circle cx="742" cy="316" r="3"/><circle cx="880" cy="312" r="3.6"/>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vgn)"/>

  <!-- Text overlay -->
  <rect x="0" y="318" width="1200" height="312" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="165" height="38" rx="19" fill="#1d4ed8"/>
  <text x="122" y="61" font-family="sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">国内DC動向</text>

  <!-- Money stat badge top right -->
  <rect x="890" y="32" width="270" height="44" rx="8" fill="#b45309" opacity="0.95"/>
  <text x="1025" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">UAEが最大1兆円を出資検討</text>

  <!-- Accent bar -->
  <rect x="40" y="418" width="5" height="122" rx="2.5" fill="#fbbf24"/>

  <!-- Kicker -->
  <text x="60" y="476" font-family="sans-serif" font-size="50" font-weight="900" fill="#fcd34d" filter="url(#ts)">秋田に2兆円、中東マネーが北を選んだ</text>

  <!-- Main headline -->
  <text x="60" y="548" font-family="sans-serif" font-size="34" font-weight="900" fill="white" filter="url(#ts)">500MW「日本最大級」AI DC構想の現実味</text>

  <!-- Sub-line -->
  <text x="60" y="596" font-family="sans-serif" font-size="17" fill="#fde68a" filter="url(#ts)">前提となる秋田沖の洋上風力は、いま事業者不在のまま再公募を待っている</text>

  <text x="1160" y="618" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
