<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: snowy Hokkaido plain, DC + wind turbines under aurora-like winter sky -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040d24"/>
      <stop offset="35%" stop-color="#0a2145"/>
      <stop offset="65%" stop-color="#12365e"/>
      <stop offset="100%" stop-color="#1e4a6b"/>
    </linearGradient>
    <radialGradient id="auroraglow" cx="50%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#040d24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dcglow" cx="62%" cy="58%" r="30%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040d24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowfield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9dcec"/>
      <stop offset="100%" stop-color="#6d94b5"/>
    </linearGradient>
    <radialGradient id="vgn" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.75)"/>
    </radialGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="35%" stop-color="rgba(0,0,0,0.55)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.93)"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,1)"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#auroraglow)"/>
  <rect width="1200" height="630" fill="url(#dcglow)"/>

  <!-- Aurora curtains -->
  <g filter="url(#blur12)" opacity="0.5">
    <path d="M 100 40 Q 260 110 400 60 Q 560 10 720 80 Q 880 145 1100 55" fill="none" stroke="#34d399" stroke-width="28"/>
    <path d="M 60 105 Q 240 165 420 120 Q 600 75 780 140 Q 960 200 1150 115" fill="none" stroke="#22d3ee" stroke-width="18" opacity="0.7"/>
  </g>

  <!-- Stars -->
  <g fill="white">
    <circle cx="90" cy="45" r="1.3"/><circle cx="230" cy="70" r="1.1"/><circle cx="390" cy="32" r="1.2"/>
    <circle cx="560" cy="58" r="1"/><circle cx="700" cy="38" r="1.3"/><circle cx="860" cy="66" r="1.1"/>
    <circle cx="1010" cy="30" r="1.2"/><circle cx="1140" cy="60" r="1"/>
    <circle cx="150" cy="130" r="1"/><circle cx="470" cy="110" r="1.1"/><circle cx="930" cy="125" r="1"/>
  </g>

  <!-- Distant mountain range -->
  <polygon points="0,330 90,265 165,305 250,240 340,300 420,270 500,320 0,340" fill="#0a1c38" opacity="0.9"/>
  <polygon points="760,320 850,255 930,300 1030,245 1120,295 1200,265 1200,340 760,340" fill="#0a1c38" opacity="0.85"/>
  <!-- snow caps -->
  <g fill="#7fa4c4" opacity="0.6">
    <polygon points="250,240 228,262 275,262"/><polygon points="1030,245 1008,268 1055,268"/>
    <polygon points="90,265 74,283 108,283"/>
  </g>

  <!-- Snow field -->
  <rect x="0" y="330" width="1200" height="300" fill="url(#snowfield)" opacity="0.28"/>
  <path d="M 0 340 Q 300 320 600 342 Q 900 362 1200 335 L 1200 630 L 0 630 Z" fill="#dbeafe" opacity="0.14"/>
  <!-- snow drift lines -->
  <g stroke="#e0f2fe" stroke-width="1.5" opacity="0.16" fill="none">
    <path d="M 0 400 Q 300 385 600 402 Q 900 418 1200 396"/>
    <path d="M 0 452 Q 320 436 640 455 Q 940 472 1200 448"/>
  </g>

  <!-- Wind turbines (Ishikari offshore wind) - left -->
  <g stroke="#e8f2fa" stroke-width="4" opacity="0.9">
    <line x1="145" y1="360" x2="145" y2="212"/>
  </g>
  <circle cx="145" cy="208" r="7" fill="#dbeafe"/>
  <g stroke="#e8f2fa" stroke-width="4" opacity="0.9">
    <line x1="145" y1="208" x2="103" y2="140"/>
    <line x1="145" y1="208" x2="196" y2="176"/>
    <line x1="145" y1="208" x2="127" y2="266"/>
  </g>
  <g stroke="#cfe3f2" stroke-width="3" opacity="0.75">
    <line x1="248" y1="368" x2="248" y2="248"/>
    <line x1="248" y1="248" x2="214" y2="196"/>
    <line x1="248" y1="248" x2="290" y2="222"/>
    <line x1="248" y1="248" x2="234" y2="296"/>
  </g>
  <circle cx="248" cy="246" r="5" fill="#cfe3f2" opacity="0.8"/>
  <g stroke="#b9d3e6" stroke-width="2.5" opacity="0.6">
    <line x1="336" y1="372" x2="336" y2="282"/>
    <line x1="336" y1="282" x2="310" y2="242"/>
    <line x1="336" y1="282" x2="368" y2="262"/>
  </g>

  <!-- MAIN AI DATA CENTER (center-right) -->
  <rect x="600" y="270" width="330" height="140" rx="4" fill="#0b1c38" stroke="#22d3ee" stroke-width="2.5"/>
  <!-- roof cooling units -->
  <g fill="#122a4d" stroke="#155e75" stroke-width="1">
    <rect x="615" y="250" width="46" height="21" rx="2"/><rect x="673" y="246" width="46" height="25" rx="2"/>
    <rect x="731" y="250" width="46" height="21" rx="2"/><rect x="789" y="246" width="46" height="25" rx="2"/>
    <rect x="847" y="250" width="46" height="21" rx="2"/>
  </g>
  <!-- server window rows -->
  <g fill="#22d3ee" opacity="0.9" filter="url(#glow)">
    <rect x="616" y="288" width="36" height="22" rx="2"/><rect x="662" y="288" width="36" height="22" rx="2"/>
    <rect x="708" y="288" width="36" height="22" rx="2"/><rect x="754" y="288" width="36" height="22" rx="2"/>
    <rect x="800" y="288" width="36" height="22" rx="2"/><rect x="846" y="288" width="36" height="22" rx="2"/>
    <rect x="616" y="322" width="36" height="22" rx="2"/><rect x="662" y="322" width="36" height="22" rx="2"/>
    <rect x="708" y="322" width="36" height="22" rx="2"/><rect x="754" y="322" width="36" height="22" rx="2"/>
    <rect x="800" y="322" width="36" height="22" rx="2"/>
    <rect x="616" y="356" width="36" height="22" rx="2"/><rect x="662" y="356" width="36" height="22" rx="2"/>
    <rect x="708" y="356" width="36" height="22" rx="2"/>
  </g>
  <!-- status LEDs -->
  <g fill="#34d399" filter="url(#glow)">
    <circle cx="905" cy="300" r="4"/><circle cx="905" cy="322" r="4"/>
  </g>
  <circle cx="905" cy="344" r="4" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Second smaller DC (Tomakomai) far right -->
  <rect x="960" y="315" width="185" height="95" rx="4" fill="#0b1c38" stroke="#0e7490" stroke-width="2"/>
  <g fill="#22d3ee" opacity="0.7" filter="url(#glow)">
    <rect x="974" y="330" width="30" height="18" rx="2"/><rect x="1012" y="330" width="30" height="18" rx="2"/>
    <rect x="1050" y="330" width="30" height="18" rx="2"/><rect x="1088" y="330" width="30" height="18" rx="2"/>
    <rect x="974" y="358" width="30" height="18" rx="2"/><rect x="1012" y="358" width="30" height="18" rx="2"/>
    <rect x="1050" y="358" width="30" height="18" rx="2"/>
  </g>

  <!-- Transmission pylons connecting the corridor -->
  <polygon points="430,395 422,268 438,268" fill="#0a172c"/>
  <line x1="402" y1="282" x2="458" y2="282" stroke="#0a172c" stroke-width="3.5"/>
  <line x1="407" y1="310" x2="453" y2="310" stroke="#0a172c" stroke-width="3"/>
  <polygon points="545,400 538,285 552,285" fill="#0a172c"/>
  <line x1="519" y1="298" x2="571" y2="298" stroke="#0a172c" stroke-width="3"/>
  <!-- power lines -->
  <g stroke="#0a172c" stroke-width="2.2" fill="none" opacity="0.85">
    <path d="M 145 300 Q 290 292 402 282 Q 470 288 519 298 Q 570 300 600 302"/>
    <path d="M 150 328 Q 295 320 407 310 Q 475 315 524 322 Q 572 325 600 328"/>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vgn)"/>

  <!-- Text overlay -->
  <rect x="0" y="320" width="1200" height="310" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="165" height="38" rx="19" fill="#1d4ed8"/>
  <text x="122" y="61" font-family="sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">国内DC動向</text>

  <!-- Warning stat badge top right -->
  <rect x="880" y="32" width="280" height="44" rx="8" fill="#b45309" opacity="0.94"/>
  <text x="1020" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">⚡ 需要693万kW vs 供給694万kW</text>

  <!-- Accent bar -->
  <rect x="40" y="418" width="5" height="122" rx="2.5" fill="#22d3ee"/>

  <!-- Kicker -->
  <text x="60" y="476" font-family="sans-serif" font-size="52" font-weight="900" fill="#7dd3fc" filter="url(#ts)">北の大地がAI立国を支える</text>

  <!-- Main headline -->
  <text x="60" y="548" font-family="sans-serif" font-size="34" font-weight="900" fill="white" filter="url(#ts)">苫小牧・石狩・千歳 — 北海道DC回廊の光と影</text>

  <!-- Sub-line -->
  <text x="60" y="596" font-family="sans-serif" font-size="17" fill="#a5f3fc" filter="url(#ts)">ラピダスと洋上風力が集う一方、電力は綱渡り。泊原発が最大の変数に</text>

  <text x="1160" y="618" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
