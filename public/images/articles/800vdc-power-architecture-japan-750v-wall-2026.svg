<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: macro of copper busbars in a switchgear cubicle — thick bars for high current beside a slim one, bolted joints, insulators. Chosen to break from the last five (control room / cooling plant / coast / building exterior / construction fit-out) and to shift the palette warm. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241608"/>
      <stop offset="52%" stop-color="#33200c"/>
      <stop offset="100%" stop-color="#150c05"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8763a"/>
      <stop offset="14%" stop-color="#f0b27a"/>
      <stop offset="34%" stop-color="#d98b4a"/>
      <stop offset="68%" stop-color="#9c5426"/>
      <stop offset="100%" stop-color="#5e3015"/>
    </linearGradient>
    <linearGradient id="cu2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b86a33"/>
      <stop offset="16%" stop-color="#e3a067"/>
      <stop offset="40%" stop-color="#c07c40"/>
      <stop offset="100%" stop-color="#4e2812"/>
    </linearGradient>
    <linearGradient id="slim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d38a4d"/>
      <stop offset="30%" stop-color="#efb887"/>
      <stop offset="100%" stop-color="#6b3a1a"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b2a28"/>
      <stop offset="50%" stop-color="#3d3b37"/>
      <stop offset="100%" stop-color="#232220"/>
    </linearGradient>
    <linearGradient id="ins" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d5b57"/>
      <stop offset="100%" stop-color="#332f2b"/>
    </linearGradient>
    <radialGradient id="key" cx="34%" cy="16%" r="62%">
      <stop offset="0%" stop-color="#ffdcae" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffdcae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vgn" cx="46%" cy="40%" r="76%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(8,4,2,0.82)"/>
    </radialGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(10,5,2,0)"/>
      <stop offset="30%" stop-color="rgba(10,5,2,0.72)"/>
      <stop offset="100%" stop-color="rgba(10,5,2,0.97)"/>
    </linearGradient>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.95)"/></filter>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.62)"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- switchgear cubicle interior, out of focus behind -->
  <g filter="url(#blur)" opacity="0.75">
    <rect x="0" y="0" width="1200" height="470" fill="url(#cab)"/>
    <g fill="#151413" opacity="0.8">
      <rect x="70" y="40" width="230" height="392" rx="4"/>
      <rect x="880" y="52" width="250" height="380" rx="4"/>
    </g>
    <g fill="#4a4743" opacity="0.7">
      <rect x="96" y="72" width="120" height="9" rx="4"/><rect x="96" y="96" width="88" height="9" rx="4"/>
      <rect x="906" y="84" width="140" height="9" rx="4"/><rect x="906" y="108" width="104" height="9" rx="4"/>
    </g>
  </g>
  <rect width="1200" height="630" fill="url(#key)"/>

  <!-- ===== MAIN BUSBAR STACK: three thick bars (high current) ===== -->
  <g filter="url(#sh)">
    <!-- bar 1 -->
    <rect x="-20" y="150" width="1240" height="58" fill="url(#cu)"/>
    <rect x="-20" y="150" width="1240" height="9" fill="#ffd9ad" opacity="0.5"/>
    <rect x="-20" y="200" width="1240" height="8" fill="#3a1c0a" opacity="0.55"/>
    <!-- bar 2 -->
    <rect x="-20" y="236" width="1240" height="58" fill="url(#cu2)"/>
    <rect x="-20" y="236" width="1240" height="9" fill="#ffd2a0" opacity="0.42"/>
    <rect x="-20" y="286" width="1240" height="8" fill="#331808" opacity="0.55"/>
    <!-- bar 3 -->
    <rect x="-20" y="322" width="1240" height="58" fill="url(#cu)"/>
    <rect x="-20" y="322" width="1240" height="9" fill="#ffd9ad" opacity="0.38"/>
    <rect x="-20" y="372" width="1240" height="8" fill="#3a1c0a" opacity="0.55"/>
  </g>

  <!-- bolted joint plates on the middle bar -->
  <g>
    <rect x="430" y="228" width="150" height="74" rx="3" fill="#a9662f" stroke="#6d3d17" stroke-width="2"/>
    <g fill="#4a2a11">
      <circle cx="456" cy="248" r="8"/><circle cx="554" cy="248" r="8"/>
      <circle cx="456" cy="282" r="8"/><circle cx="554" cy="282" r="8"/>
    </g>
    <g fill="#d79a5e">
      <circle cx="456" cy="246" r="5"/><circle cx="554" cy="246" r="5"/>
      <circle cx="456" cy="280" r="5"/><circle cx="554" cy="280" r="5"/>
    </g>
  </g>
  <!-- joint plate on the top bar -->
  <g>
    <rect x="770" y="142" width="132" height="74" rx="3" fill="#b06e34" stroke="#733f18" stroke-width="2"/>
    <g fill="#4a2a11">
      <circle cx="794" cy="162" r="7"/><circle cx="878" cy="162" r="7"/>
      <circle cx="794" cy="196" r="7"/><circle cx="878" cy="196" r="7"/>
    </g>
    <g fill="#d79a5e">
      <circle cx="794" cy="160" r="4.4"/><circle cx="878" cy="160" r="4.4"/>
      <circle cx="794" cy="194" r="4.4"/><circle cx="878" cy="194" r="4.4"/>
    </g>
  </g>

  <!-- standoff insulators supporting the stack -->
  <g>
    <rect x="176" y="208" width="34" height="28" fill="url(#ins)"/>
    <rect x="170" y="204" width="46" height="8" rx="3" fill="#6a6660"/>
    <rect x="176" y="294" width="34" height="28" fill="url(#ins)"/>
    <rect x="170" y="290" width="46" height="8" rx="3" fill="#6a6660"/>

    <rect x="1000" y="208" width="34" height="28" fill="url(#ins)"/>
    <rect x="994" y="204" width="46" height="8" rx="3" fill="#6a6660"/>
    <rect x="1000" y="294" width="34" height="28" fill="url(#ins)"/>
    <rect x="994" y="290" width="46" height="8" rx="3" fill="#6a6660"/>
  </g>

  <!-- ===== THE SLIM BAR: same power, higher voltage, far less copper ===== -->
  <g filter="url(#sh)">
    <rect x="-20" y="100" width="1240" height="15" fill="url(#slim)"/>
    <rect x="-20" y="100" width="1240" height="4" fill="#ffe0bb" opacity="0.6"/>
  </g>
  <!-- its small standoffs — same power, far less copper -->
  <g fill="url(#ins)">
    <rect x="300" y="115" width="22" height="20"/><rect x="860" y="115" width="22" height="20"/>
  </g>

  <!-- fine machining highlights along the bars -->
  <g stroke="#ffe3c0" stroke-width="1" opacity="0.16">
    <line x1="-20" y1="168" x2="1220" y2="168"/><line x1="-20" y1="254" x2="1220" y2="254"/>
    <line x1="-20" y1="340" x2="1220" y2="340"/>
  </g>

  <rect width="1200" height="630" fill="url(#vgn)"/>
  <rect x="0" y="288" width="1200" height="342" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="188" height="38" rx="19" fill="#0f766e"/>
  <text x="134" y="61" font-family="sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">電力・冷却技術</text>

  <!-- Spec badge top right -->
  <rect x="846" y="32" width="314" height="44" rx="8" fill="#7c2d12" opacity="0.96"/>
  <text x="1003" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">1ラック1MW・2027年</text>

  <!-- Accent bar -->
  <rect x="40" y="404" width="5" height="128" rx="2.5" fill="#fb923c"/>

  <!-- Kicker -->
  <text x="60" y="462" font-family="sans-serif" font-size="46" font-weight="900" fill="#fdba74" filter="url(#ts)">1ラック1MWを、どう配るか</text>

  <!-- Main headline -->
  <text x="60" y="534" font-family="sans-serif" font-size="31" font-weight="900" fill="white" filter="url(#ts)">AI DCは直流800Vへ — だが日本には「750Vの壁」がある</text>

  <!-- Sub-line -->
  <text x="60" y="582" font-family="sans-serif" font-size="17" fill="#fed7aa" filter="url(#ts)">54Vのままなら1万1千アンペア — 電技省令では、世界が低圧と呼ぶ800Vが高圧になる</text>

  <text x="1160" y="606" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
