<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: bright midday, a residential neighbourhood in the foreground with a certified data center behind it -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="42%" stop-color="#7dd3fc"/>
      <stop offset="78%" stop-color="#cfe9f7"/>
      <stop offset="100%" stop-color="#eaf5fb"/>
    </linearGradient>
    <radialGradient id="sunhaze" cx="80%" cy="14%" r="40%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fef3c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86b95f"/>
      <stop offset="100%" stop-color="#4d7a36"/>
    </linearGradient>
    <linearGradient id="dcface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(8,12,24,0)"/>
      <stop offset="34%" stop-color="rgba(8,12,24,0.62)"/>
      <stop offset="100%" stop-color="rgba(8,12,24,0.95)"/>
    </linearGradient>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.95)"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#sunhaze)"/>

  <!-- Fair-weather clouds -->
  <g fill="#ffffff" opacity="0.85" filter="url(#soft)">
    <ellipse cx="180" cy="96" rx="72" ry="26"/><ellipse cx="238" cy="86" rx="52" ry="22"/><ellipse cx="128" cy="104" rx="46" ry="19"/>
    <ellipse cx="612" cy="70" rx="60" ry="21"/><ellipse cx="662" cy="62" rx="44" ry="17"/>
    <ellipse cx="960" cy="128" rx="66" ry="22"/><ellipse cx="1012" cy="120" rx="46" ry="18"/>
  </g>

  <!-- Distant low hills -->
  <path d="M 0 336 Q 180 306 380 330 Q 600 354 820 324 Q 1010 300 1200 328 L 1200 372 L 0 372 Z" fill="#8fb6c9" opacity="0.55"/>

  <!-- THE DATA CENTER: large, clean, mid-ground, with rooftop solar -->
  <rect x="470" y="238" width="480" height="150" rx="3" fill="url(#dcface)" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#b4c2d1" opacity="0.85">
    <rect x="482" y="262" width="456" height="14"/><rect x="482" y="298" width="456" height="14"/>
    <rect x="482" y="334" width="456" height="14"/>
  </g>
  <g fill="#eff6ff" opacity="0.9">
    <rect x="496" y="284" width="34" height="12"/><rect x="546" y="284" width="34" height="12"/>
    <rect x="596" y="284" width="34" height="12"/><rect x="646" y="284" width="34" height="12"/>
    <rect x="696" y="284" width="34" height="12"/><rect x="746" y="284" width="34" height="12"/>
    <rect x="796" y="284" width="34" height="12"/><rect x="846" y="284" width="34" height="12"/>
  </g>
  <!-- rooftop solar array (renewables criterion) -->
  <g fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.2" opacity="0.95">
    <polygon points="492,238 556,238 546,220 502,220"/><polygon points="566,238 630,238 620,220 576,220"/>
    <polygon points="640,238 704,238 694,220 650,220"/><polygon points="714,238 778,238 768,220 724,220"/>
    <polygon points="788,238 852,238 842,220 798,220"/><polygon points="862,238 926,238 916,220 872,220"/>
  </g>
  <!-- rooftop cooling plant -->
  <g fill="#cbd5e1" stroke="#94a3b8" stroke-width="1">
    <rect x="500" y="206" width="40" height="14" rx="2"/><rect x="620" y="204" width="40" height="16" rx="2"/>
    <rect x="760" y="206" width="40" height="14" rx="2"/><rect x="880" y="204" width="40" height="16" rx="2"/>
  </g>
  <!-- a small substation beside it -->
  <g stroke="#64748b" stroke-width="2.4" fill="none">
    <line x1="984" y1="388" x2="984" y2="300"/><line x1="1024" y1="388" x2="1024" y2="300"/>
    <line x1="968" y1="312" x2="1040" y2="312"/><line x1="968" y1="340" x2="1040" y2="340"/>
  </g>
  <g fill="#94a3b8"><rect x="972" y="356" width="26" height="32" rx="2"/><rect x="1010" y="356" width="26" height="32" rx="2"/></g>

  <!-- Green belt between the DC and the neighbourhood -->
  <rect x="0" y="388" width="1200" height="242" fill="url(#ground)"/>
  <g fill="#3f6b2c">
    <ellipse cx="120" cy="392" rx="34" ry="26"/><ellipse cx="196" cy="386" rx="28" ry="22"/>
    <ellipse cx="300" cy="394" rx="32" ry="24"/><ellipse cx="392" cy="386" rx="26" ry="21"/>
    <ellipse cx="1092" cy="392" rx="34" ry="26"/><ellipse cx="1162" cy="386" rx="26" ry="21"/>
  </g>

  <!-- RESIDENTIAL NEIGHBOURHOOD in the foreground -->
  <g>
    <rect x="86" y="452" width="132" height="96" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="72,452 152,404 232,452" fill="#b45309"/>
    <rect x="120" y="486" width="30" height="26" fill="#93c5fd"/><rect x="164" y="486" width="30" height="26" fill="#93c5fd"/>
    <rect x="132" y="518" width="26" height="30" fill="#7c3f14"/>

    <rect x="266" y="470" width="118" height="80" fill="#fefce8" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="254,470 325,428 396,470" fill="#7f1d1d"/>
    <rect x="294" y="498" width="28" height="24" fill="#93c5fd"/><rect x="334" y="498" width="28" height="24" fill="#93c5fd"/>

    <rect x="430" y="462" width="126" height="90" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="416,462 493,416 570,462" fill="#334155"/>
    <rect x="462" y="492" width="30" height="26" fill="#93c5fd"/><rect x="506" y="492" width="30" height="26" fill="#93c5fd"/>

    <rect x="612" y="476" width="112" height="76" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="600,476 668,436 736,476" fill="#0f766e"/>
    <rect x="640" y="502" width="26" height="22" fill="#93c5fd"/><rect x="678" y="502" width="26" height="22" fill="#93c5fd"/>
  </g>

  <!-- laundry pole: signs of daily life -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="790" y1="546" x2="790" y2="482"/><line x1="860" y1="546" x2="860" y2="482"/>
    <line x1="790" y1="490" x2="860" y2="490"/>
  </g>
  <g fill="#ffffff" opacity="0.95">
    <rect x="800" y="490" width="16" height="26" rx="2"/><rect x="822" y="490" width="14" height="22" rx="2"/>
    <rect x="842" y="490" width="12" height="20" rx="2"/>
  </g>

  <!-- Utility poles along the street, connecting the two worlds -->
  <g stroke="#78716c" stroke-width="4">
    <line x1="940" y1="560" x2="940" y2="424"/><line x1="1120" y1="572" x2="1120" y2="440"/>
  </g>
  <g stroke="#78716c" stroke-width="3">
    <line x1="916" y1="440" x2="964" y2="440"/><line x1="1098" y1="456" x2="1142" y2="456"/>
  </g>
  <g stroke="#57534e" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M 940 444 Q 1030 466 1120 460"/><path d="M 940 452 Q 1030 474 1120 468"/>
    <path d="M 1024 388 Q 980 410 940 436"/>
  </g>

  <rect x="0" y="360" width="1200" height="46" fill="#dbeafe" opacity="0.4" filter="url(#blur10)"/>

  <!-- Text overlay -->
  <rect x="0" y="300" width="1200" height="330" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="165" height="38" rx="19" fill="#1d4ed8"/>
  <text x="122" y="61" font-family="sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">国内DC動向</text>

  <!-- Rank badge top right -->
  <rect x="878" y="32" width="282" height="44" rx="8" fill="#6d28d9" opacity="0.96"/>
  <text x="1019" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">プラチナ認定で補助金15億円</text>

  <!-- Accent bar -->
  <rect x="40" y="418" width="5" height="122" rx="2.5" fill="#8b5cf6"/>

  <!-- Kicker -->
  <text x="60" y="476" font-family="sans-serif" font-size="50" font-weight="900" fill="#c4b5fd" filter="url(#ts)">東京都が「優良DC」を格付けする</text>

  <!-- Main headline -->
  <text x="60" y="548" font-family="sans-serif" font-size="33" font-weight="900" fill="white" filter="url(#ts)">反対運動の次に来る「制度化フェーズ」が始まった</text>

  <!-- Sub-line -->
  <text x="60" y="596" font-family="sans-serif" font-size="17" fill="#ddd6fe" filter="url(#ts)">都道府県で初。だが都は10年前にも似た制度を作り、2年で終えている</text>

  <text x="1160" y="618" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
