<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: Data Center Alley at dawn, transmission pylons, load curve collapsing -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="34%" stop-color="#1a1330"/>
      <stop offset="66%" stop-color="#3a1f2e"/>
      <stop offset="100%" stop-color="#6b3520"/>
    </linearGradient>
    <radialGradient id="alertglow" cx="52%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dcglow" cx="80%" cy="60%" r="26%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vgn" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.8)"/>
    </radialGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="35%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.95)"/>
    </linearGradient>
    <linearGradient id="curvefill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hotglow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,1)"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#alertglow)"/>
  <rect width="1200" height="630" fill="url(#dcglow)"/>

  <!-- Faint grid graticule, like a SCADA screen -->
  <g stroke="#f59e0b" stroke-width="0.6" opacity="0.09">
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="150" y1="60" x2="150" y2="440"/><line x1="350" y1="60" x2="350" y2="440"/>
    <line x1="550" y1="60" x2="550" y2="440"/><line x1="750" y1="60" x2="750" y2="440"/>
    <line x1="950" y1="60" x2="950" y2="440"/>
  </g>

  <!-- THE LOAD CURVE: flat, then a vertical collapse in two steps -->
  <path d="M 60 210 L 300 208 L 470 206 L 560 205 L 562 300 L 690 299 L 692 372 L 900 371 L 1140 370 L 1140 440 L 60 440 Z" fill="url(#curvefill)"/>
  <path d="M 60 210 L 300 208 L 470 206 L 560 205 L 562 300 L 690 299 L 692 372 L 900 371 L 1140 370"
        fill="none" stroke="#fb923c" stroke-width="4.5" stroke-linejoin="miter" filter="url(#hotglow)"/>
  <!-- drop markers -->
  <circle cx="562" cy="205" r="7" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="692" cy="299" r="6" fill="#ef4444" filter="url(#glow)"/>
  <g font-family="sans-serif" font-weight="700" fill="#fecaca">
    <text x="576" y="262" font-size="18">−2,970MW</text>
    <text x="706" y="344" font-size="17">−1,099MW</text>
  </g>

  <!-- Transmission pylons silhouetted along the horizon -->
  <g fill="#080810">
    <polygon points="120,470 110,300 130,300"/>
    <polygon points="330,478 320,292 340,292"/>
    <polygon points="540,484 530,300 550,300"/>
  </g>
  <g stroke="#080810" stroke-width="4">
    <line x1="86" y1="316" x2="154" y2="316"/><line x1="93" y1="350" x2="147" y2="350"/>
    <line x1="294" y1="308" x2="366" y2="308"/><line x1="302" y1="344" x2="358" y2="344"/>
    <line x1="504" y1="316" x2="576" y2="316"/><line x1="512" y1="352" x2="568" y2="352"/>
  </g>
  <!-- sagging power lines -->
  <g stroke="#080810" stroke-width="2.4" fill="none" opacity="0.9">
    <path d="M 86 316 Q 210 348 294 308"/><path d="M 366 308 Q 452 346 504 316"/>
    <path d="M 93 350 Q 212 382 302 344"/><path d="M 358 344 Q 448 380 512 352"/>
    <path d="M 576 316 Q 700 356 820 330"/>
  </g>
  <!-- fault flash on the line -->
  <g filter="url(#hotglow)">
    <circle cx="452" cy="346" r="9" fill="#fde68a"/>
    <g stroke="#fde68a" stroke-width="3" opacity="0.9">
      <line x1="452" y1="322" x2="452" y2="304"/><line x1="452" y1="370" x2="452" y2="388"/>
      <line x1="428" y1="346" x2="410" y2="346"/><line x1="476" y1="346" x2="494" y2="346"/>
      <line x1="435" y1="329" x2="422" y2="316"/><line x1="469" y1="363" x2="482" y2="376"/>
    </g>
  </g>

  <!-- Ground -->
  <path d="M 0 468 Q 300 460 640 470 Q 920 478 1200 464 L 1200 630 L 0 630 Z" fill="#0b0a14"/>

  <!-- DATA CENTER ALLEY: a row of halls, windows switched to amber (on backup power) -->
  <g>
    <rect x="620" y="352" width="176" height="118" rx="3" fill="#120d1c" stroke="#c2410c" stroke-width="2"/>
    <rect x="806" y="336" width="196" height="134" rx="3" fill="#120d1c" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="1012" y="364" width="156" height="106" rx="3" fill="#120d1c" stroke="#c2410c" stroke-width="2"/>
  </g>
  <!-- roof plant -->
  <g fill="#1c1424" stroke="#7c2d12" stroke-width="1">
    <rect x="634" y="334" width="42" height="19" rx="2"/><rect x="688" y="334" width="42" height="19" rx="2"/>
    <rect x="742" y="334" width="42" height="19" rx="2"/>
    <rect x="820" y="316" width="46" height="21" rx="2"/><rect x="878" y="312" width="46" height="25" rx="2"/>
    <rect x="936" y="316" width="46" height="21" rx="2"/>
    <rect x="1026" y="346" width="40" height="19" rx="2"/><rect x="1078" y="346" width="40" height="19" rx="2"/>
  </g>
  <!-- amber windows = running on backup generation -->
  <g fill="#fbbf24" opacity="0.92" filter="url(#glow)">
    <rect x="634" y="372" width="30" height="19" rx="2"/><rect x="672" y="372" width="30" height="19" rx="2"/>
    <rect x="710" y="372" width="30" height="19" rx="2"/><rect x="748" y="372" width="30" height="19" rx="2"/>
    <rect x="634" y="402" width="30" height="19" rx="2"/><rect x="672" y="402" width="30" height="19" rx="2"/>
    <rect x="710" y="402" width="30" height="19" rx="2"/>
    <rect x="820" y="356" width="32" height="20" rx="2"/><rect x="862" y="356" width="32" height="20" rx="2"/>
    <rect x="904" y="356" width="32" height="20" rx="2"/><rect x="946" y="356" width="32" height="20" rx="2"/>
    <rect x="820" y="388" width="32" height="20" rx="2"/><rect x="862" y="388" width="32" height="20" rx="2"/>
    <rect x="904" y="388" width="32" height="20" rx="2"/><rect x="946" y="388" width="32" height="20" rx="2"/>
    <rect x="820" y="420" width="32" height="20" rx="2"/><rect x="862" y="420" width="32" height="20" rx="2"/>
    <rect x="1026" y="384" width="28" height="18" rx="2"/><rect x="1062" y="384" width="28" height="18" rx="2"/>
    <rect x="1098" y="384" width="28" height="18" rx="2"/>
    <rect x="1026" y="412" width="28" height="18" rx="2"/><rect x="1062" y="412" width="28" height="18" rx="2"/>
  </g>
  <!-- a couple of windows still cyan, mid-transfer -->
  <g fill="#22d3ee" opacity="0.75" filter="url(#glow)">
    <rect x="748" y="402" width="30" height="19" rx="2"/>
    <rect x="988" y="420" width="14" height="20" rx="2"/>
    <rect x="1098" y="412" width="28" height="18" rx="2"/>
  </g>
  <!-- exhaust plumes from standby generators -->
  <g fill="#9ca3af" opacity="0.2" filter="url(#blur12)">
    <ellipse cx="700" cy="318" rx="46" ry="16"/>
    <ellipse cx="890" cy="296" rx="56" ry="19"/>
    <ellipse cx="1064" cy="330" rx="40" ry="14"/>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vgn)"/>

  <!-- Text overlay -->
  <rect x="0" y="318" width="1200" height="312" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="180" height="38" rx="19" fill="#0d9488"/>
  <text x="130" y="61" font-family="sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">電力・冷却技術</text>

  <!-- Alert badge top right -->
  <rect x="884" y="32" width="276" height="44" rx="8" fill="#b91c1c" opacity="0.95"/>
  <text x="1022" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">⚠ 3,800MWが数秒で消失</text>

  <!-- Accent bar -->
  <rect x="40" y="418" width="5" height="122" rx="2.5" fill="#fb923c"/>

  <!-- Kicker -->
  <text x="60" y="476" font-family="sans-serif" font-size="52" font-weight="900" fill="#fdba74" filter="url(#ts)">3.8GWが数秒で消えた日</text>

  <!-- Main headline -->
  <text x="60" y="548" font-family="sans-serif" font-size="33" font-weight="900" fill="white" filter="url(#ts)">DCが電力系統を揺らし、世界が「負担」と「責任」を問い始めた</text>

  <!-- Sub-line -->
  <text x="60" y="596" font-family="sans-serif" font-size="17" fill="#fed7aa" filter="url(#ts)">需要側にもライドスルー義務へ — 日本は費用に手を打ち、責任はこれから</text>

  <text x="1160" y="618" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
