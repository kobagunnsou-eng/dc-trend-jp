<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: a subsea cable landing point — empty Pacific shore, route markers, an unmarked landing station inland -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e6ea8"/>
      <stop offset="48%" stop-color="#5fa5cd"/>
      <stop offset="100%" stop-color="#bcd9e6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14506e"/>
      <stop offset="60%" stop-color="#1d6b8a"/>
      <stop offset="100%" stop-color="#3f8fa8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8a888"/>
      <stop offset="45%" stop-color="#a2916f"/>
      <stop offset="100%" stop-color="#7d6f53"/>
    </linearGradient>
    <linearGradient id="station" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dfe4e8"/>
      <stop offset="100%" stop-color="#a9b2ba"/>
    </linearGradient>
    <radialGradient id="sunhaze" cx="76%" cy="12%" r="46%">
      <stop offset="0%" stop-color="#fffdf2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#bcd9e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vgn" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(6,20,30,0.62)"/>
    </radialGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(4,14,22,0)"/>
      <stop offset="34%" stop-color="rgba(4,14,22,0.62)"/>
      <stop offset="100%" stop-color="rgba(4,14,22,0.95)"/>
    </linearGradient>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.95)"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#sunhaze)"/>

  <!-- high cirrus -->
  <g fill="#ffffff" opacity="0.5" filter="url(#soft)">
    <ellipse cx="200" cy="70" rx="180" ry="14"/><ellipse cx="330" cy="96" rx="130" ry="10"/>
    <ellipse cx="820" cy="58" rx="200" ry="12"/><ellipse cx="1000" cy="88" rx="150" ry="9"/>
  </g>

  <!-- ===== PACIFIC OCEAN, upper half ===== -->
  <rect x="0" y="196" width="1200" height="206" fill="url(#sea)"/>
  <!-- horizon line -->
  <rect x="0" y="194" width="1200" height="3" fill="#0e3f58" opacity="0.5"/>
  <!-- swell bands -->
  <g stroke="#9fd0e0" stroke-width="1.6" opacity="0.22" fill="none">
    <path d="M 0 226 Q 300 218 600 228 Q 900 238 1200 222"/>
    <path d="M 0 262 Q 320 254 640 266 Q 940 276 1200 258"/>
    <path d="M 0 302 Q 340 292 680 306 Q 980 318 1200 296"/>
    <path d="M 0 348 Q 360 336 720 352 Q 1000 364 1200 340"/>
  </g>
  <!-- sun glitter on water -->
  <g fill="#eaf6fb" opacity="0.35">
    <rect x="856" y="212" width="70" height="3" rx="1.5"/><rect x="840" y="236" width="102" height="3.5" rx="1.5"/>
    <rect x="824" y="264" width="134" height="4" rx="2"/><rect x="838" y="294" width="108" height="3.5" rx="1.5"/>
    <rect x="854" y="326" width="76" height="3" rx="1.5"/><rect x="866" y="356" width="52" height="2.5" rx="1"/>
  </g>
  <!-- distant cable ship on the horizon -->
  <g fill="#0b2f43" opacity="0.8">
    <rect x="286" y="182" width="52" height="9" rx="2"/>
    <rect x="300" y="172" width="16" height="11"/>
    <rect x="322" y="176" width="5" height="8"/>
  </g>

  <!-- ===== SURF LINE ===== -->
  <path d="M 0 396 Q 200 386 420 400 Q 660 416 900 398 Q 1060 386 1200 396 L 1200 424 Q 1040 414 900 424 Q 660 442 420 426 Q 200 412 0 424 Z" fill="#e8f4f8" opacity="0.85"/>
  <path d="M 0 414 Q 220 404 440 418 Q 680 434 920 416 Q 1070 404 1200 414 L 1200 434 L 0 434 Z" fill="#f4fafc" opacity="0.55"/>

  <!-- ===== WET SAND / BEACH ===== -->
  <rect x="0" y="424" width="1200" height="206" fill="url(#sand)"/>
  <!-- tide lines -->
  <g stroke="#8d7f60" stroke-width="1.4" opacity="0.3" fill="none">
    <path d="M 0 452 Q 300 444 600 456 Q 900 466 1200 448"/>
    <path d="M 0 486 Q 320 478 640 490 Q 940 500 1200 482"/>
  </g>
  <!-- damp sheen near the water -->
  <rect x="0" y="424" width="1200" height="34" fill="#cfd8dc" opacity="0.22"/>

  <!-- ===== CABLE ROUTE MARKER POSTS running inland ===== -->
  <g>
    <!-- post 1 (nearest the surf, smallest) -->
    <rect x="418" y="432" width="5" height="26" fill="#e8e2d4"/>
    <rect x="410" y="424" width="21" height="11" rx="2" fill="#f59e0b"/>
    <!-- post 2 -->
    <rect x="404" y="472" width="6" height="34" fill="#e8e2d4"/>
    <rect x="394" y="462" width="26" height="13" rx="2" fill="#f59e0b"/>
    <!-- post 3 -->
    <rect x="386" y="524" width="8" height="44" fill="#efe9dc"/>
    <rect x="372" y="510" width="34" height="17" rx="2" fill="#f59e0b"/>
    <!-- post 4 (nearest camera, largest) -->
    <rect x="360" y="580" width="10" height="50" fill="#f2ede2"/>
    <rect x="342" y="562" width="44" height="21" rx="2" fill="#f59e0b"/>
  </g>
  <!-- cable duct manhole covers marking the buried route -->
  <g fill="#5f5847" opacity="0.85">
    <ellipse cx="470" cy="470" rx="15" ry="6"/>
    <ellipse cx="512" cy="512" rx="20" ry="8"/>
    <ellipse cx="566" cy="574" rx="27" ry="10"/>
  </g>
  <g stroke="#7d745e" stroke-width="1.2" opacity="0.5" fill="none">
    <path d="M 424 444 Q 470 470 512 512 Q 546 546 566 574"/>
  </g>

  <!-- ===== CABLE LANDING STATION, inland right ===== -->
  <rect x="812" y="330" width="252" height="96" rx="2" fill="url(#station)" stroke="#8d969e" stroke-width="1.8"/>
  <rect x="812" y="324" width="252" height="9" fill="#eef2f5"/>
  <!-- no windows: a blank, anonymous building -->
  <g fill="#9aa4ac" opacity="0.7">
    <rect x="828" y="352" width="220" height="7"/><rect x="828" y="376" width="220" height="7"/>
  </g>
  <rect x="900" y="392" width="46" height="34" fill="#5b656d"/>
  <!-- rooftop microwave dish + mast -->
  <g fill="#8b949c">
    <rect x="1032" y="286" width="5" height="40"/>
    <circle cx="1000" cy="312" r="14"/>
    <rect x="994" y="300" width="4" height="26"/>
  </g>
  <!-- security fence around the station -->
  <g stroke="#6e7780" stroke-width="1.6" opacity="0.85">
    <line x1="782" y1="430" x2="1094" y2="430"/><line x1="782" y1="442" x2="1094" y2="442"/>
  </g>
  <g stroke="#636c74" stroke-width="1.3" opacity="0.75">
    <line x1="800" y1="424" x2="800" y2="452"/><line x1="866" y1="424" x2="866" y2="452"/>
    <line x1="932" y1="424" x2="932" y2="452"/><line x1="998" y1="424" x2="998" y2="452"/>
    <line x1="1064" y1="424" x2="1064" y2="452"/>
  </g>
  <!-- utility poles feeding the station -->
  <g fill="#6b6455">
    <rect x="742" y="352" width="5" height="82"/><rect x="668" y="366" width="4" height="70"/>
  </g>
  <g stroke="#5c5648" stroke-width="1.6" fill="none" opacity="0.8">
    <line x1="672" y1="372" x2="746" y2="358"/><line x1="746" y1="358" x2="812" y2="348"/>
  </g>

  <!-- dune grass tufts, foreground -->
  <g stroke="#6f7a49" stroke-width="2" opacity="0.75" fill="none">
    <path d="M 80 620 Q 86 594 78 574"/><path d="M 90 620 Q 100 596 112 578"/><path d="M 100 622 Q 104 600 98 582"/>
    <path d="M 1108 616 Q 1116 592 1108 572"/><path d="M 1120 618 Q 1132 596 1146 580"/>
  </g>

  <rect width="1200" height="630" fill="url(#vgn)"/>

  <!-- Text overlay -->
  <rect x="0" y="300" width="1200" height="330" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="165" height="38" rx="19" fill="#0369a1"/>
  <text x="122" y="61" font-family="sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">海外DC動向</text>

  <!-- Capacity badge top right -->
  <rect x="874" y="32" width="286" height="44" rx="8" fill="#0c4a6e" opacity="0.96"/>
  <text x="1017" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">420Tbps・2029年運用開始</text>

  <!-- Accent bar -->
  <rect x="40" y="418" width="5" height="122" rx="2.5" fill="#0ea5e9"/>

  <!-- Kicker -->
  <text x="60" y="476" font-family="sans-serif" font-size="48" font-weight="900" fill="#67e8f9" filter="url(#ts)">AWSが日米に海底ケーブルを敷く</text>

  <!-- Main headline -->
  <text x="60" y="548" font-family="sans-serif" font-size="32" font-weight="900" fill="white" filter="url(#ts)">「どこに陸揚げするか」が日本の弱点を突いている</text>

  <!-- Sub-line -->
  <text x="60" y="596" font-family="sans-serif" font-size="17" fill="#bae6fd" filter="url(#ts)">日本の陸揚局は千葉と三重に集中 — 震災では10か所が障害、復旧に半年</text>

  <text x="1160" y="618" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
