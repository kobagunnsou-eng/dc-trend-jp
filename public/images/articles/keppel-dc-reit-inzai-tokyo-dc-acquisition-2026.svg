<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: two hyperscale data halls in Inzai on a wet, overcast day — a finished, occupied, income-producing asset -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c5560"/>
      <stop offset="55%" stop-color="#6b7480"/>
      <stop offset="100%" stop-color="#8d959e"/>
    </linearGradient>
    <linearGradient id="hallA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b7bec6"/>
      <stop offset="60%" stop-color="#98a1aa"/>
      <stop offset="100%" stop-color="#79828c"/>
    </linearGradient>
    <linearGradient id="hallB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9aa3ac"/>
      <stop offset="100%" stop-color="#6f7881"/>
    </linearGradient>
    <linearGradient id="tarmac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5058"/>
      <stop offset="45%" stop-color="#383e45"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b45a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0b45a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vgn" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(10,12,16,0.72)"/>
    </radialGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(8,10,14,0)"/>
      <stop offset="34%" stop-color="rgba(8,10,14,0.64)"/>
      <stop offset="100%" stop-color="rgba(8,10,14,0.96)"/>
    </linearGradient>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,1)"/></filter>
    <filter id="lamp"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="mist"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- low rain cloud -->
  <g fill="#5a636e" opacity="0.7" filter="url(#mist)">
    <ellipse cx="240" cy="70" rx="300" ry="52"/>
    <ellipse cx="780" cy="48" rx="340" ry="46"/>
    <ellipse cx="1120" cy="96" rx="220" ry="42"/>
  </g>

  <!-- distant treeline -->
  <path d="M 0 336 Q 120 322 210 334 Q 320 320 430 336 Q 560 322 690 336 Q 830 322 960 336 Q 1090 324 1200 334 L 1200 360 L 0 360 Z" fill="#3f4a41" opacity="0.85"/>

  <!-- ===== HALL A (left, nearer) ===== -->
  <rect x="60" y="180" width="470" height="212" fill="url(#hallA)" stroke="#6e7781" stroke-width="2"/>
  <!-- facade panel joints -->
  <g stroke="#828b95" stroke-width="1.5" opacity="0.75">
    <line x1="140" y1="180" x2="140" y2="392"/><line x1="220" y1="180" x2="220" y2="392"/>
    <line x1="300" y1="180" x2="300" y2="392"/><line x1="380" y1="180" x2="380" y2="392"/>
    <line x1="460" y1="180" x2="460" y2="392"/>
    <line x1="60" y1="250" x2="530" y2="250"/><line x1="60" y1="322" x2="530" y2="322"/>
  </g>
  <!-- parapet + roof plant -->
  <rect x="60" y="172" width="470" height="12" fill="#c8cfd6"/>
  <g fill="#7d868f" stroke="#606870" stroke-width="1">
    <rect x="96" y="146" width="66" height="27" rx="2"/><rect x="182" y="142" width="66" height="31" rx="2"/>
    <rect x="268" y="146" width="66" height="27" rx="2"/><rect x="354" y="142" width="66" height="31" rx="2"/>
    <rect x="440" y="146" width="60" height="27" rx="2"/>
  </g>
  <!-- louvre bands (no windows — this is a data hall) -->
  <g fill="#5c656e" opacity="0.85">
    <rect x="76" y="266" width="438" height="16"/><rect x="76" y="292" width="438" height="16"/>
  </g>
  <!-- entrance canopy with warm light -->
  <rect x="236" y="352" width="118" height="40" fill="#39414a"/>
  <rect x="248" y="360" width="94" height="26" fill="#f3c179" opacity="0.9" filter="url(#lamp)"/>

  <!-- ===== HALL B (right, set back) ===== -->
  <rect x="596" y="216" width="428" height="176" fill="url(#hallB)" stroke="#606870" stroke-width="2"/>
  <g stroke="#767f89" stroke-width="1.4" opacity="0.6">
    <line x1="668" y1="216" x2="668" y2="392"/><line x1="740" y1="216" x2="740" y2="392"/>
    <line x1="812" y1="216" x2="812" y2="392"/><line x1="884" y1="216" x2="884" y2="392"/>
    <line x1="956" y1="216" x2="956" y2="392"/>
    <line x1="596" y1="282" x2="1024" y2="282"/>
  </g>
  <rect x="596" y="208" width="428" height="11" fill="#b3bbc3"/>
  <g fill="#6d767f" stroke="#565e66" stroke-width="1">
    <rect x="628" y="184" width="60" height="24" rx="2"/><rect x="708" y="180" width="60" height="28" rx="2"/>
    <rect x="788" y="184" width="60" height="24" rx="2"/><rect x="868" y="180" width="60" height="28" rx="2"/>
  </g>
  <g fill="#545d66" opacity="0.85">
    <rect x="610" y="300" width="400" height="14"/><rect x="610" y="324" width="400" height="14"/>
  </g>
  <rect x="760" y="358" width="96" height="34" fill="#333b43"/>
  <rect x="770" y="365" width="76" height="21" fill="#f3c179" opacity="0.85" filter="url(#lamp)"/>

  <!-- substation yard between the two halls -->
  <g stroke="#4d555e" stroke-width="2.4" fill="none">
    <line x1="548" y1="392" x2="548" y2="300"/><line x1="580" y1="392" x2="580" y2="300"/>
    <line x1="536" y1="312" x2="592" y2="312"/><line x1="536" y1="338" x2="592" y2="338"/>
  </g>
  <g fill="#4a525b"><rect x="540" y="356" width="20" height="36" rx="2"/><rect x="568" y="356" width="20" height="36" rx="2"/></g>

  <!-- pole lights -->
  <g fill="#535b64">
    <rect x="176" y="256" width="6" height="140"/><rect x="700" y="272" width="5" height="124"/><rect x="1084" y="264" width="6" height="132"/>
  </g>
  <g fill="#f6cf92" filter="url(#lamp)">
    <ellipse cx="179" cy="252" rx="15" ry="7"/><ellipse cx="702" cy="268" rx="13" ry="6"/><ellipse cx="1087" cy="260" rx="15" ry="7"/>
  </g>

  <!-- perimeter fence -->
  <g stroke="#586069" stroke-width="2">
    <line x1="0" y1="398" x2="1200" y2="398"/>
    <line x1="0" y1="418" x2="1200" y2="418"/>
  </g>
  <g stroke="#4e565f" stroke-width="1.4" opacity="0.8">
    <line x1="70" y1="392" x2="70" y2="432"/><line x1="230" y1="392" x2="230" y2="432"/>
    <line x1="390" y1="392" x2="390" y2="432"/><line x1="550" y1="392" x2="550" y2="432"/>
    <line x1="710" y1="392" x2="710" y2="432"/><line x1="870" y1="392" x2="870" y2="432"/>
    <line x1="1030" y1="392" x2="1030" y2="432"/><line x1="1180" y1="392" x2="1180" y2="432"/>
  </g>

  <!-- ===== WET TARMAC ===== -->
  <rect x="0" y="430" width="1200" height="200" fill="url(#tarmac)"/>
  <!-- vertical reflections of the halls and lamps -->
  <g opacity="0.35">
    <rect x="60" y="430" width="470" height="120" fill="#8d959e" opacity="0.28"/>
    <rect x="596" y="430" width="428" height="96" fill="#7c858e" opacity="0.22"/>
  </g>
  <rect x="248" y="430" width="94" height="150" fill="url(#reflect)"/>
  <rect x="770" y="430" width="76" height="120" fill="url(#reflect)" opacity="0.8"/>
  <rect x="170" y="430" width="18" height="170" fill="url(#reflect)" opacity="0.7"/>
  <rect x="1078" y="430" width="18" height="160" fill="url(#reflect)" opacity="0.6"/>
  <!-- ripples / puddle edges -->
  <g stroke="#aeb7c0" stroke-width="1.2" opacity="0.16" fill="none">
    <path d="M 0 470 Q 300 462 600 472 Q 900 482 1200 466"/>
    <path d="M 0 516 Q 320 508 640 520 Q 940 530 1200 512"/>
    <path d="M 0 570 Q 340 560 680 574 Q 980 584 1200 566"/>
  </g>
  <!-- road markings, softened by water -->
  <g fill="#c6ccd3" opacity="0.22">
    <rect x="120" y="500" width="66" height="6" rx="2"/><rect x="248" y="500" width="66" height="6" rx="2"/>
    <rect x="376" y="500" width="66" height="6" rx="2"/><rect x="504" y="500" width="66" height="6" rx="2"/>
  </g>

  <!-- falling rain -->
  <g stroke="#dbe3ea" stroke-width="1.1" opacity="0.28">
    <line x1="90" y1="70" x2="80" y2="118"/><line x1="250" y1="40" x2="240" y2="92"/>
    <line x1="410" y1="96" x2="400" y2="146"/><line x1="560" y1="52" x2="550" y2="104"/>
    <line x1="720" y1="110" x2="710" y2="158"/><line x1="880" y1="62" x2="870" y2="112"/>
    <line x1="1040" y1="102" x2="1030" y2="152"/><line x1="1160" y1="56" x2="1150" y2="106"/>
    <line x1="170" y1="180" x2="160" y2="228"/><line x1="330" y1="212" x2="320" y2="258"/>
    <line x1="620" y1="176" x2="610" y2="224"/><line x1="960" y1="196" x2="950" y2="244"/>
  </g>

  <rect width="1200" height="630" fill="url(#vgn)"/>

  <!-- Text overlay -->
  <rect x="0" y="300" width="1200" height="330" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="196" height="38" rx="19" fill="#a16207"/>
  <text x="138" y="61" font-family="sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">市場データ・統計</text>

  <!-- Deal badge top right -->
  <rect x="880" y="32" width="280" height="44" rx="8" fill="#334155" opacity="0.96"/>
  <text x="1020" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">日本比率 9% → 23% へ</text>

  <!-- Accent bar -->
  <rect x="40" y="418" width="5" height="122" rx="2.5" fill="#f59e0b"/>

  <!-- Kicker -->
  <text x="60" y="476" font-family="sans-serif" font-size="50" font-weight="900" fill="#fde68a" filter="url(#ts)">印西の2棟に1,900億円</text>

  <!-- Main headline -->
  <text x="60" y="548" font-family="sans-serif" font-size="32" font-weight="900" fill="white" filter="url(#ts)">シンガポールのREITが買った「日本のDC」という金融商品</text>

  <!-- Sub-line -->
  <text x="60" y="596" font-family="sans-serif" font-size="17" fill="#fef3c7" filter="url(#ts)">開発ではなく、完成して満床の物件が売買される — 作る市場から持つ市場へ</text>

  <text x="1160" y="618" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
