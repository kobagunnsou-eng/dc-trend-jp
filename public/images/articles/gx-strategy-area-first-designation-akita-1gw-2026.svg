<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Photo: straight-down aerial of a decommissioned coastal thermal power station —
         demolished boiler house as bare foundations, but the switchyard, transmission towers
         and intake channel all still intact. Composition type 5 (true overhead), unused so far;
         breaks from the last five (copper macro / control room / cooling plant / coast / exterior). -->
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a8878"/>
      <stop offset="55%" stop-color="#72705f"/>
      <stop offset="100%" stop-color="#3f3e37"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4a5e"/>
      <stop offset="100%" stop-color="#123746"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d8b7e"/>
      <stop offset="100%" stop-color="#6f6d62"/>
    </linearGradient>
    <radialGradient id="vgn" cx="50%" cy="40%" r="76%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(10,10,6,0.62)"/>
    </radialGradient>
    <linearGradient id="tov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(10,11,8,0)"/>
      <stop offset="30%" stop-color="rgba(10,11,8,0.72)"/>
      <stop offset="100%" stop-color="rgba(10,11,8,0.97)"/>
    </linearGradient>
    <filter id="ts"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.95)"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>

  <!-- ===== SEA along the top edge (coastal siting) ===== -->
  <rect x="0" y="0" width="1200" height="118" fill="url(#sea)"/>
  <g stroke="#3f7d94" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 0 34 Q 300 26 600 36 Q 900 46 1200 30"/>
    <path d="M 0 72 Q 320 64 640 74 Q 940 84 1200 68"/>
  </g>
  <!-- quay wall -->
  <rect x="0" y="112" width="1200" height="14" fill="#8a8879"/>
  <rect x="0" y="126" width="1200" height="6" fill="#5c5b50" opacity="0.7"/>

  <!-- intake / discharge channels cutting inland -->
  <g fill="url(#sea)">
    <rect x="196" y="118" width="46" height="150"/>
    <rect x="292" y="118" width="46" height="196"/>
  </g>
  <g fill="#8a8879">
    <rect x="188" y="118" width="8" height="152"/><rect x="242" y="118" width="8" height="152"/>
    <rect x="284" y="118" width="8" height="198"/><rect x="338" y="118" width="8" height="198"/>
  </g>

  <!-- ===== DEMOLISHED BOILER HOUSE: bare foundations ===== -->
  <g>
    <rect x="170" y="286" width="330" height="176" fill="#5a5952" stroke="#4b4a43" stroke-width="2"/>
    <!-- foundation grid where the building stood -->
    <g stroke="#565549" stroke-width="3">
      <line x1="170" y1="330" x2="500" y2="330"/><line x1="170" y1="374" x2="500" y2="374"/>
      <line x1="170" y1="418" x2="500" y2="418"/>
      <line x1="226" y1="286" x2="226" y2="462"/><line x1="282" y1="286" x2="282" y2="462"/>
      <line x1="338" y1="286" x2="338" y2="462"/><line x1="394" y1="286" x2="394" y2="462"/>
      <line x1="450" y1="286" x2="450" y2="462"/>
    </g>
    <!-- pile caps -->
    <g fill="#7e7d70">
      <rect x="214" y="318" width="24" height="24"/><rect x="326" y="318" width="24" height="24"/>
      <rect x="438" y="318" width="24" height="24"/><rect x="270" y="362" width="24" height="24"/>
      <rect x="382" y="362" width="24" height="24"/><rect x="214" y="406" width="24" height="24"/>
      <rect x="326" y="406" width="24" height="24"/><rect x="438" y="406" width="24" height="24"/>
    </g>
  </g>
  <!-- two circular stack bases, cut off at ground level -->
  <g>
    <circle cx="548" cy="330" r="33" fill="#7e7d70" stroke="#4b4a43" stroke-width="2.5"/>
    <circle cx="548" cy="330" r="17" fill="#4f4e45"/>
    <circle cx="548" cy="416" r="33" fill="#7e7d70" stroke="#4b4a43" stroke-width="2.5"/>
    <circle cx="548" cy="416" r="17" fill="#4f4e45"/>
  </g>
  <!-- demolition laydown: stacked material -->
  <g fill="#5f5e53" opacity="0.9">
    <rect x="188" y="486" width="92" height="26" rx="2"/>
    <rect x="300" y="486" width="72" height="26" rx="2"/>
    <rect x="392" y="490" width="58" height="22" rx="2"/>
  </g>

  <!-- ===== THE SWITCHYARD — still intact, the real asset ===== -->
  <rect x="680" y="250" width="404" height="240" fill="#7b7a6a" stroke="#46453e" stroke-width="2"/>
  <!-- gantry bays -->
  <g stroke="#c3c0ad" stroke-width="5">
    <line x1="700" y1="278" x2="1064" y2="278"/><line x1="700" y1="336" x2="1064" y2="336"/>
    <line x1="700" y1="394" x2="1064" y2="394"/><line x1="700" y1="452" x2="1064" y2="452"/>
  </g>
  <!-- breakers and disconnectors seen from above -->
  <g fill="#e2dfc9" stroke="#3f3e37" stroke-width="1.6">
    <rect x="742" y="268" width="26" height="20"/><rect x="838" y="268" width="26" height="20"/>
    <rect x="934" y="268" width="26" height="20"/>
    <rect x="742" y="326" width="26" height="20"/><rect x="838" y="326" width="26" height="20"/>
    <rect x="934" y="326" width="26" height="20"/>
    <rect x="742" y="384" width="26" height="20"/><rect x="838" y="384" width="26" height="20"/>
    <rect x="934" y="384" width="26" height="20"/>
    <rect x="742" y="442" width="26" height="20"/><rect x="838" y="442" width="26" height="20"/>
    <rect x="934" y="442" width="26" height="20"/>
  </g>
  <!-- transformer bays -->
  <g fill="#bdbaa6" stroke="#3f3e37" stroke-width="1.8">
    <rect x="1000" y="262" width="52" height="40" rx="2"/>
    <rect x="1000" y="320" width="52" height="40" rx="2"/>
    <rect x="1000" y="378" width="52" height="40" rx="2"/>
  </g>
  <!-- perimeter fence -->
  <g stroke="#7d7b6c" stroke-width="1.6" opacity="0.8" fill="none">
    <rect x="668" y="238" width="428" height="264"/>
  </g>

  <!-- ===== TRANSMISSION LINES leaving the site ===== -->
  <!-- towers as overhead squares with cross bracing -->
  <g>
    <g fill="#a8a595" stroke="#3f3e37" stroke-width="2">
      <rect x="1102" y="296" width="30" height="30"/>
      <rect x="1102" y="384" width="30" height="30"/>
    </g>
    <g stroke="#3f3e37" stroke-width="1.6">
      <line x1="1102" y1="296" x2="1132" y2="326"/><line x1="1132" y1="296" x2="1102" y2="326"/>
      <line x1="1102" y1="384" x2="1132" y2="414"/><line x1="1132" y1="384" x2="1102" y2="414"/>
    </g>
  </g>
  <!-- conductors running off frame -->
  <g stroke="#2f2e29" stroke-width="2.4" opacity="0.85">
    <line x1="1052" y1="282" x2="1117" y2="304"/><line x1="1052" y1="292" x2="1117" y2="310"/>
    <line x1="1117" y1="316" x2="1200" y2="292"/><line x1="1117" y1="322" x2="1200" y2="300"/>
    <line x1="1052" y1="398" x2="1117" y2="392"/><line x1="1052" y1="408" x2="1117" y2="398"/>
    <line x1="1117" y1="404" x2="1200" y2="418"/><line x1="1117" y1="410" x2="1200" y2="426"/>
  </g>

  <!-- service roads -->
  <g fill="#7a7869">
    <rect x="0" y="466" width="1200" height="26"/>
    <rect x="596" y="132" width="22" height="360"/>
  </g>
  <g stroke="#c9c6b2" stroke-width="2" stroke-dasharray="18 22" opacity="0.5">
    <line x1="0" y1="479" x2="1200" y2="479"/>
  </g>

  <!-- scrub / vacant land in the foreground -->
  <g fill="#4e5140" opacity="0.6" filter="url(#soft)">
    <ellipse cx="120" cy="540" rx="120" ry="44"/>
    <ellipse cx="430" cy="556" rx="150" ry="40"/>
    <ellipse cx="860" cy="548" rx="170" ry="46"/>
  </g>

  <rect width="1200" height="630" fill="url(#vgn)"/>
  <rect x="0" y="288" width="1200" height="342" fill="url(#tov)"/>

  <!-- Category badge -->
  <rect x="40" y="36" width="172" height="38" rx="19" fill="#b45309"/>
  <text x="126" y="61" font-family="Meiryo, Yu Gothic UI, Noto Sans JP, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">国内DC動向</text>

  <!-- Spec badge -->
  <rect x="856" y="32" width="304" height="44" rx="8" fill="#7c2d12" opacity="0.96"/>
  <text x="1008" y="60" font-family="Meiryo, Yu Gothic UI, Noto Sans JP, sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">18自治体・1GW構想</text>

  <!-- Accent bar -->
  <rect x="40" y="404" width="5" height="128" rx="2.5" fill="#f59e0b"/>

  <!-- Kicker -->
  <text x="60" y="462" font-family="Meiryo, Yu Gothic UI, Noto Sans JP, sans-serif" font-size="45" font-weight="900" fill="#fcd34d" filter="url(#ts)">国が18の市町村を名指しした</text>

  <!-- Main headline -->
  <text x="60" y="534" font-family="Meiryo, Yu Gothic UI, Noto Sans JP, sans-serif" font-size="31" font-weight="900" fill="white" filter="url(#ts)">火力発電所の跡地に、1ギガワットのDCが動き出す</text>

  <!-- Sub-line -->
  <text x="60" y="582" font-family="Meiryo, Yu Gothic UI, Noto Sans JP, sans-serif" font-size="17" fill="#fde68a" filter="url(#ts)">建屋は消えても、開閉所と送電線は残っている — GX戦略地域、第1弾認定</text>

  <text x="1160" y="606" font-family="Meiryo, Yu Gothic UI, Noto Sans JP, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="end">DCトレンド研究</text>
</svg>
